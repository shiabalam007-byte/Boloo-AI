name: boloo_ai
description: BOLOO AI - Speak With Confidence. Unlock Opportunities.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # AI
  google_generative_ai: ^0.4.6

  # Voice
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2

  # UI & Animations
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Payments / Webview
  webview_flutter: ^4.8.0

  # Utilities
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  intl: ^0.20.0
  uuid: ^4.4.2
  http: ^1.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0
  custom_lint: ^0.7.1
  riverpod_lint: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: DMMonoMedium
      fonts:
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
